name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  # Rebuild weekly so the bundled server snapshot stays fresh.
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

env:
  MIHOMO_VERSION: v1.19.34

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Verify signed source catalog
        run: |
          base64 -d catalog/catalog.json.sig > "$RUNNER_TEMP/catalog.sig"
          openssl pkeyutl -verify -rawin -pubin \
            -inkey catalog/public-key.pem \
            -sigfile "$RUNNER_TEMP/catalog.sig" \
            -in catalog/catalog.json
          python3 -m json.tool catalog/catalog.json > /dev/null

      - name: Build Mihomo core (gomobile AAR)
        working-directory: core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          go get "github.com/metacubex/mihomo@${MIHOMO_VERSION}" golang.org/x/mobile/bind@latest
          go mod tidy
          go test ./...
          go install golang.org/x/mobile/cmd/gomobile@latest golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -v \
            -tags with_gvisor,cmfa -trimpath \
            -ldflags "-s -w -buildid= -X 'github.com/metacubex/mihomo/constant.Version=${MIHOMO_VERSION}'" \
            -androidapi 26 \
            -target android/arm64,android/arm,android/amd64 \
            -o ../app/libs/core.aar .

      - name: Bundle rule sets and server snapshot
        run: bash scripts/fetch-assets.sh

      - name: Decode signing key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "dir=release" >> "$GITHUB_OUTPUT"
          else
            echo "No KEYSTORE_BASE64 secret: building a debug APK"
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "dir=debug" >> "$GITHUB_OUTPUT"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36'

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
          KEYSTORE_PATH: ${{ steps.sign.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Without the secret this env var is "", which Gradle would treat as a keystore path.
          [ -z "$KEYSTORE_PATH" ] && unset KEYSTORE_PATH
          gradle --no-daemon ${{ steps.sign.outputs.task }}
          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Prepare phone and TV deliverables
        run: |
          mkdir -p app/build/deliverables
          cp app/build/outputs/apk/phone/${{ steps.sign.outputs.dir }}/*arm64-v8a*.apk \
            app/build/deliverables/butone-phone-arm64.apk
          cp app/build/outputs/apk/tv/${{ steps.sign.outputs.dir }}/*universal*.apk \
            app/build/deliverables/butone-google-tv-universal.apk

      - name: Create and verify signed Google Play bundle
        if: steps.sign.outputs.dir == 'release'
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
          KEYSTORE_PATH: ${{ steps.sign.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUTONE_ADS_MODE: ${{ vars.BUTONE_LIVE_ADS == 'true' && 'live' || 'off' }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
          ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID }}
        run: |
          gradle --no-daemon :app:bundlePhoneRelease
          bundle=app/build/outputs/bundle/phoneRelease/app-phone-release.aab
          jarsigner -verify "$bundle"
          keytool -printcert -jarfile "$bundle" | grep SHA256
          python3 scripts/check-aab-alignment.py "$bundle"
          mkdir -p app/build/play
          cp "$bundle" "app/build/play/butone-phone-${BUTONE_ADS_MODE}.aab"

      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.dir == 'release'
        with:
          name: butone-google-play-aab
          path: app/build/play/*.aab
          if-no-files-found: error

      - name: Build separate APK with Google test ads
        if: github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/')
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ format('0.1.{0}', github.run_number) }}
          KEYSTORE_PATH: ${{ steps.sign.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUTONE_ADS_MODE: test
        run: |
          if [ -z "$KEYSTORE_PATH" ]; then unset KEYSTORE_PATH; fi
          gradle --no-daemon :app:assemblePhone${{ steps.sign.outputs.dir == 'release' && 'Release' || 'Debug' }}
          mkdir -p app/build/test-ads
          cp app/build/outputs/apk/phone/${{ steps.sign.outputs.dir }}/*universal*.apk \
            app/build/test-ads/butone-phone-ads-test.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/')
        with:
          name: butone-phone-test-ads
          path: app/build/test-ads/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: butone-apk
          path: app/build/deliverables/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/deliverables/*.apk
