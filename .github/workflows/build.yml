name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  # Rebuild weekly so the bundled server snapshot stays fresh.
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

env:
  MIHOMO_VERSION: v1.19.33

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Build Mihomo core (gomobile AAR)
        working-directory: core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          go get "github.com/metacubex/mihomo@${MIHOMO_VERSION}" golang.org/x/mobile/bind@latest
          go mod tidy
          go install golang.org/x/mobile/cmd/gomobile@latest golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -v \
            -tags with_gvisor -trimpath \
            -ldflags "-s -w -buildid= -X 'github.com/metacubex/mihomo/constant.Version=${MIHOMO_VERSION}'" \
            -androidapi 26 \
            -target android/arm64,android/arm,android/amd64 \
            -o ../app/libs/core.aar .

      - name: Bundle rule sets and server snapshot
        run: bash scripts/fetch-assets.sh

      - name: Decode signing key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "dir=release" >> "$GITHUB_OUTPUT"
          else
            echo "No KEYSTORE_BASE64 secret: building a debug APK"
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "dir=debug" >> "$GITHUB_OUTPUT"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
          KEYSTORE_PATH: ${{ steps.sign.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Without the secret this env var is "", which Gradle would treat as a keystore path.
          [ -z "$KEYSTORE_PATH" ] && unset KEYSTORE_PATH
          gradle --no-daemon ${{ steps.sign.outputs.task }}
          ls -la app/build/outputs/apk/${{ steps.sign.outputs.dir }}/

      - uses: actions/upload-artifact@v4
        with:
          name: knopka-vpn-apk
          path: app/build/outputs/apk/${{ steps.sign.outputs.dir }}/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/${{ steps.sign.outputs.dir }}/*.apk
